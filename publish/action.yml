name: Forge publish
description: Write latest.json (sha256 per platform) and create the GitHub Release from the dist artifact.

inputs:
  tag:
    description: Release tag, for example v1.2.0. Tags with a hyphen are published as prereleases.
    default: ${{ github.ref_name }}
  forge-ref:
    description: Commit, tag or branch of camaleaun/forge used to build the manifest.
    default: trunk
  pattern:
    description: Glob of the artifact names produced by camaleaun/forge-action. All matches are merged into dist, so a build matrix (dist-macos, dist-linux-x86_64, dist-linux-arm64) publishes as one release.
    default: dist*
  token:
    description: Token with contents:write on the repository.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: camaleaun/forge
        ref: ${{ inputs.forge-ref }}
        path: .forge
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - uses: actions/download-artifact@v4
      with:
        pattern: ${{ inputs.pattern }}
        merge-multiple: true
        path: dist
    - name: Write latest.json
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: .forge/bin/forge manifest --dir dist --tag "$TAG" --repo "$GITHUB_REPOSITORY" > latest.json
    - name: Create the release
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        GH_TOKEN: ${{ inputs.token }}
        # Without this, `gh` needs a git checkout of the repository to know where to create the release.
        GH_REPO: ${{ github.repository }}
      run: |
        flags=""
        case "$TAG" in *-*) flags="--prerelease" ;; esac
        # shellcheck disable=SC2086
        gh release create "$TAG" dist/* latest.json --generate-notes $flags
