name: Forge build
description: Build a forge app, package it (dmg and zip on macOS; deb, rpm, tar.gz, AppImage and snap on Linux) and upload the dist artifact.

inputs:
  project-dir:
    description: Directory that holds package.json, App.tsx and App.css.
    default: .
  forge-ref:
    description: Commit, tag or branch of camaleaun/forge used to build.
    default: trunk
  node-version:
    description: Node.js version used to run forge.
    default: '24'
  target:
    description: 'Platform to build: macos (needs a macOS runner) or linux (needs a Linux runner, x86_64 or arm64).'
    default: macos
  snap:
    description: 'Linux only. Build the .snap too (snapcore/action-build). Use "false" to skip it.'
    default: 'true'
  artifact-name:
    description: Name of the uploaded artifact. In a build matrix make it unique per job, for example dist-linux-arm64.
    default: dist
  macos-certificate-p12:
    description: Optional. base64 of the Developer ID Application certificate (.p12). Without signing inputs the app is signed ad-hoc.
    default: ''
  macos-certificate-password:
    description: Optional. Password of the .p12.
    default: ''
  macos-signing-identity:
    description: 'Optional. For example "Developer ID Application: Your Name (TEAMID)".'
    default: ''
  notary-key-p8:
    description: Optional. base64 of the App Store Connect API key (.p8). Enables notarization.
    default: ''
  notary-key-id:
    description: Optional. App Store Connect API key id.
    default: ''
  notary-issuer-id:
    description: Optional. App Store Connect API issuer id.
    default: ''

outputs:
  version:
    description: App version read from package.json.
    value: ${{ steps.package.outputs.version || steps.package-linux.outputs.version }}

runs:
  using: composite
  steps:
    - name: Check the runner and target match
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        RUNNER_OS_NAME: ${{ runner.os }}
      run: |
        case "$TARGET:$RUNNER_OS_NAME" in
          macos:macOS | linux:Linux) ;;
          macos:* | linux:*)
            echo "target \"$TARGET\" needs a ${TARGET} runner, but this job runs on $RUNNER_OS_NAME" >&2
            exit 1
            ;;
          *)
            echo "unknown target \"$TARGET\" (use macos or linux)" >&2
            exit 1
            ;;
        esac
    - uses: actions/checkout@v4
      with:
        repository: camaleaun/forge
        ref: ${{ inputs.forge-ref }}
        path: .forge
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
    - name: Import the signing certificate (skipped without inputs)
      if: inputs.target == 'macos'
      shell: bash
      env:
        MACOS_CERTIFICATE_P12: ${{ inputs.macos-certificate-p12 }}
        MACOS_CERTIFICATE_PASSWORD: ${{ inputs.macos-certificate-password }}
        MACOS_SIGNING_IDENTITY: ${{ inputs.macos-signing-identity }}
        NOTARY_KEY_P8: ${{ inputs.notary-key-p8 }}
        NOTARY_KEY_ID: ${{ inputs.notary-key-id }}
        NOTARY_ISSUER_ID: ${{ inputs.notary-issuer-id }}
      run: .forge/scripts/macos-sign.sh import-certificate
    - name: Generate sources
      if: inputs.target == 'macos'
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.project-dir }}
      run: .forge/bin/forge build --project "$PROJECT_DIR" --out "$RUNNER_TEMP/forge-src" --strict-i18n
    - name: Build
      if: inputs.target == 'macos'
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.project-dir }}
      run: |
        name="$(.forge/bin/forge info --project "$PROJECT_DIR" --field name)"
        cmake -S "$RUNNER_TEMP/forge-src" -B "$RUNNER_TEMP/forge-out" -DCMAKE_BUILD_TYPE=Release
        cmake --build "$RUNNER_TEMP/forge-out"
    - name: Sign, notarize and staple the app (ad-hoc signature without inputs)
      if: inputs.target == 'macos'
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.project-dir }}
        MACOS_CERTIFICATE_P12: ${{ inputs.macos-certificate-p12 }}
        MACOS_CERTIFICATE_PASSWORD: ${{ inputs.macos-certificate-password }}
        MACOS_SIGNING_IDENTITY: ${{ inputs.macos-signing-identity }}
        NOTARY_KEY_P8: ${{ inputs.notary-key-p8 }}
        NOTARY_KEY_ID: ${{ inputs.notary-key-id }}
        NOTARY_ISSUER_ID: ${{ inputs.notary-issuer-id }}
      run: |
        name="$(.forge/bin/forge info --project "$PROJECT_DIR" --field name)"
        .forge/scripts/macos-sign.sh sign "$RUNNER_TEMP/forge-out/${name}.app"
        .forge/scripts/macos-sign.sh notarize "$RUNNER_TEMP/forge-out/${name}.app"
        .forge/scripts/macos-sign.sh staple "$RUNNER_TEMP/forge-out/${name}.app"
    - name: Package
      if: inputs.target == 'macos'
      id: package
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.project-dir }}
        MACOS_CERTIFICATE_P12: ${{ inputs.macos-certificate-p12 }}
        MACOS_CERTIFICATE_PASSWORD: ${{ inputs.macos-certificate-password }}
        MACOS_SIGNING_IDENTITY: ${{ inputs.macos-signing-identity }}
        NOTARY_KEY_P8: ${{ inputs.notary-key-p8 }}
        NOTARY_KEY_ID: ${{ inputs.notary-key-id }}
        NOTARY_ISSUER_ID: ${{ inputs.notary-issuer-id }}
      run: |
        name="$(.forge/bin/forge info --project "$PROJECT_DIR" --field name)"
        version="$(.forge/bin/forge info --project "$PROJECT_DIR" --field version)"
        mkdir -p "$GITHUB_WORKSPACE/dist"
        .forge/scripts/macos-dmg.sh "$RUNNER_TEMP/forge-out/CPackConfig.cmake" "$RUNNER_TEMP/forge-cpack" "$name"
        dmg="$GITHUB_WORKSPACE/dist/${name}-${version}-darwin-arm64.dmg"
        mv "$RUNNER_TEMP/forge-cpack/${name}-"*.dmg "$dmg"
        .forge/scripts/macos-sign.sh sign "$dmg"
        .forge/scripts/macos-sign.sh notarize "$dmg"
        .forge/scripts/macos-sign.sh staple "$dmg"
        # Language packs (if the app has i18n/) are release files like the dmg and the zip.
        if compgen -G "$RUNNER_TEMP/forge-src/lang/*.lang" > /dev/null; then
          cp "$RUNNER_TEMP/forge-src/lang/"*.lang "$GITHUB_WORKSPACE/dist/"
        fi
        ditto -c -k --keepParent "$RUNNER_TEMP/forge-out/${name}.app" "$GITHUB_WORKSPACE/dist/${name}-${version}-darwin-arm64.zip"
        echo "version=${version}" >> "$GITHUB_OUTPUT"
    - name: Install the build tools (Linux)
      if: inputs.target == 'linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends cmake g++ pkg-config libgtk-4-dev libsoup-3.0-dev rpm squashfs-tools
    - name: Generate sources (Linux)
      if: inputs.target == 'linux'
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.project-dir }}
      run: .forge/bin/forge build --project "$PROJECT_DIR" --out "$RUNNER_TEMP/forge-src" --strict-i18n --target linux
    - name: Build (Linux)
      if: inputs.target == 'linux'
      shell: bash
      run: |
        cmake -S "$RUNNER_TEMP/forge-src" -B "$RUNNER_TEMP/forge-out" -DCMAKE_BUILD_TYPE=Release
        cmake --build "$RUNNER_TEMP/forge-out"
    - name: Package deb, rpm, tar.gz and AppImage (Linux)
      if: inputs.target == 'linux'
      id: package-linux
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.project-dir }}
      run: |
        name="$(.forge/bin/forge info --project "$PROJECT_DIR" --field name)"
        version="$(.forge/bin/forge info --project "$PROJECT_DIR" --field version)"
        case "$(uname -m)" in
          x86_64) arch=x86_64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "unsupported architecture $(uname -m)" >&2; exit 1 ;;
        esac
        mkdir -p "$GITHUB_WORKSPACE/dist"
        # CPack names the files <name>-<version>-linux-<arch>.{deb,rpm,tar.gz}; it stages outside dist.
        cpack --config "$RUNNER_TEMP/forge-out/CPackConfig.cmake" -B "$RUNNER_TEMP/forge-cpack"
        mv "$RUNNER_TEMP/forge-cpack/${name}-${version}-linux-${arch}".{deb,rpm,tar.gz} "$GITHUB_WORKSPACE/dist/"
        DESTDIR="$RUNNER_TEMP/forge-root" cmake --install "$RUNNER_TEMP/forge-out"
        desktop="$(ls "$RUNNER_TEMP/forge-root/usr/share/applications/"*.desktop)"
        app_id="$(basename "$desktop" .desktop)"
        .forge/scripts/linux-appimage.sh "$RUNNER_TEMP/forge-root" "$name" "$app_id" "$arch" "$GITHUB_WORKSPACE/dist/${name}-${version}-linux-${arch}.AppImage"
        # Language packs (if the app has i18n/) are release files too.
        if compgen -G "$RUNNER_TEMP/forge-src/lang/*.lang" > /dev/null; then
          cp "$RUNNER_TEMP/forge-src/lang/"*.lang "$GITHUB_WORKSPACE/dist/"
        fi
        echo "version=${version}" >> "$GITHUB_OUTPUT"
    - name: Build the snap with snapcore/action-build (Linux)
      if: inputs.target == 'linux' && inputs.snap == 'true'
      id: snapcraft
      # snapcore/action-build v1.3.0
      uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79
      with:
        path: ${{ runner.temp }}/forge-src
    - name: Name the snap (Linux)
      if: inputs.target == 'linux' && inputs.snap == 'true'
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.project-dir }}
        SNAP_FILE: ${{ steps.snapcraft.outputs.snap }}
      run: |
        name="$(.forge/bin/forge info --project "$PROJECT_DIR" --field name)"
        version="$(.forge/bin/forge info --project "$PROJECT_DIR" --field version)"
        case "$(uname -m)" in
          x86_64) arch=x86_64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "unsupported architecture $(uname -m)" >&2; exit 1 ;;
        esac
        mkdir -p "$GITHUB_WORKSPACE/dist"
        mv "$SNAP_FILE" "$GITHUB_WORKSPACE/dist/${name}-${version}-linux-${arch}.snap"
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          dist/*.dmg
          dist/*.zip
          dist/*.lang
          dist/*.deb
          dist/*.rpm
          dist/*.tar.gz
          dist/*.AppImage
          dist/*.snap
